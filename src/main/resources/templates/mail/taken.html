<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout :: layout(#{mail.taken.subject}, ~{::content})}">
<body>
<div th:fragment="content">
    <p th:text="#{mail.taken.html.notice}">Someone tried to create a QSP account with this email address, which already has an account.</p>

</div>

</html>
