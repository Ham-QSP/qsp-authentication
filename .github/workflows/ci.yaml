name: Authentication server CI

on:
  push:
    branches:
      - main
      - ciTest
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version, for example 1.0.0. Defaults to the current POM version without -SNAPSHOT.
        required: false
        type: string
      development_version:
        description: Next development version, for example 1.0.1-SNAPSHOT. Defaults to the Maven Release Plugin suggestion.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  JAVA_VERSION: '25'

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      - name: Maven verify
        run: ./mvnw --batch-mode --update-snapshots verify

      - name: Upload build JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: target/*.jar
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Build
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Download maven, build result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          path: target
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          tags: f4fez/qsp-authentication-server:latest
          context: .
          file: .package/Dockerfile

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure Maven SCM authentication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Resolve release options
        id: release-options
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          DEVELOPMENT_VERSION: ${{ inputs.development_version }}
        run: |
          if [[ -n "${RELEASE_VERSION}" ]]; then
            if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid release_version '${RELEASE_VERSION}', expected MAJOR.MINOR.PATCH"
              exit 1
            fi
            echo "release_args=-DreleaseVersion=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -n "${DEVELOPMENT_VERSION}" ]]; then
            if [[ ! "${DEVELOPMENT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
              echo "::error::Invalid development_version '${DEVELOPMENT_VERSION}', expected MAJOR.MINOR.PATCH-SNAPSHOT"
              exit 1
            fi
            echo "development_args=-DdevelopmentVersion=${DEVELOPMENT_VERSION}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Maven release
        shell: bash
        env:
          RELEASE_ARGS: ${{ steps.release-options.outputs.release_args }}
          DEVELOPMENT_ARGS: ${{ steps.release-options.outputs.development_args }}
        run: |
          extra_args=()
          if [[ -n "${RELEASE_ARGS}" ]]; then
            extra_args+=("${RELEASE_ARGS}")
          fi
          if [[ -n "${DEVELOPMENT_ARGS}" ]]; then
            extra_args+=("${DEVELOPMENT_ARGS}")
          fi

          ./mvnw --batch-mode \
            release:prepare release:perform \
            -Dgoals=package \
            -Darguments=-DskipTests \
            "${extra_args[@]}"

      - name: Resolve created release tag
        id: release
        shell: bash
        run: |
          tag="$(git describe --tags --abbrev=0)"
          version="${tag#v}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            target/checkout/target/*.jar \
            --title "${RELEASE_TAG}" \
            --generate-notes

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          context: target/checkout
          file: target/checkout/.package/Dockerfile
          tags: |
            f4fez/qsp-authentication-server:${{ steps.release.outputs.version }}
            f4fez/qsp-authentication-server:latest
