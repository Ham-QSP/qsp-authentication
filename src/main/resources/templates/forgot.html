<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(#{forgot.title}, ~{::content})}">
<body>
<div th:fragment="content">
    <p th:text="#{forgot.intro}">Enter your callsign: a code will be sent to the email address of your account.</p>
    <form method="post" th:action="@{/password/forgot}" class="auth-form">
        <label for="callsign" th:text="#{signup.callsign}">Callsign</label>
        <input type="text" id="callsign" name="callsign" autocomplete="username" autocapitalize="characters" autofocus required>
        <button type="submit" th:text="#{forgot.submit}">Send a code</button>
    </form>
    <p class="auth-actions"><a th:href="@{/password/forgot/verify}" th:text="#{signup.have-code}">I already have a code</a></p>
</div>
</body>
</html>
