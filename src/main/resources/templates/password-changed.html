<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${expired} ? #{password.title.expired} : #{password.title.change}, ~{::content})}">
<body>
<div th:fragment="content">
    <th:block th:replace="~{fragments/layout :: alert('info', #{password.changed})}"></th:block>
    <p class="auth-actions" th:if="${expired}"><a th:href="@{/login}" th:text="#{password.sign-in}">Sign in</a></p>
</div>
</body>
</html>
