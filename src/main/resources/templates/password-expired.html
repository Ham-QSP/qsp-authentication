<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(#{password-expired.title}, ~{::content})}">
<body>
<div th:fragment="content">
    <p th:text="#{password-expired.intro(${username})}">The password has expired. Choose a new one.</p>
    <th:block th:if="${error}"><th:block th:replace="~{fragments/layout :: alert('error', ${error})}"></th:block></th:block>
    <form method="post" th:action="@{/password-expired}" class="auth-form">
        <label for="newPassword" th:text="#{password-expired.new-password}">New password</label>
        <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" autofocus required>
        <label for="confirmPassword" th:text="#{password-expired.confirm-password}">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
        <button type="submit" th:text="#{password-expired.submit}">Change password</button>
    </form>
</div>
</body>
</html>
