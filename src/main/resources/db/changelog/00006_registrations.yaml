# Self-registration requests waiting for an email validation, kept apart from the real accounts.
databaseChangeLog:
- changeSet:
    id:  8
    author:  "Florian MAZEN"
    changes:
      - createTable:
          tableName: qsp_auth_registrations
          columns:
            - column:
                name: id
                type: uuid
                defaultValueComputed: gen_random_uuid()
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: callsign
                type: varchar(100)
                constraints:
                  nullable: false
            - column:
                name: email
                type: varchar(320)
                constraints:
                  nullable: false
            - column:
                name: password_hash
                type: varchar(100)
                constraints:
                  nullable: false
            - column:
                name: code_hash
                type: varchar(100)
                constraints:
                  nullable: false
            - column:
                name: code_expires_at
                type: timestamp
                constraints:
                  nullable: false
            - column:
                name: failed_attempts
                type: integer
                defaultValueNumeric: 0
                constraints:
                  nullable: false
            - column:
                name: last_sent_at
                type: timestamp
                constraints:
                  nullable: false
            - column:
                name: status
                type: varchar(30)
                constraints:
                  nullable: false
            - column:
                name: created_at
                type: timestamp
                constraints:
                  nullable: false
      - createIndex:
          indexName: ux_auth_registrations_callsign_upper
          tableName: qsp_auth_registrations
          unique: true
          columns:
            - column:
                name: upper(callsign)
                computed: true
      - createIndex:
          indexName: ux_auth_registrations_email_lower
          tableName: qsp_auth_registrations
          unique: true
          columns:
            - column:
                name: lower(email)
                computed: true
      - createTable:
          tableName: qsp_auth_registration_sends
          columns:
            - column:
                name: id
                type: uuid
                defaultValueComputed: gen_random_uuid()
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: email
                type: varchar(320)
                constraints:
                  nullable: false
            - column:
                name: callsign
                type: varchar(100)
                constraints:
                  nullable: false
            - column:
                name: sent_at
                type: timestamp
                constraints:
                  nullable: false
      - createIndex:
          indexName: ix_auth_registration_sends_email
          tableName: qsp_auth_registration_sends
          columns:
            - column:
                name: email
            - column:
                name: sent_at
      - createIndex:
          indexName: ix_auth_registration_sends_callsign
          tableName: qsp_auth_registration_sends
          columns:
            - column:
                name: callsign
            - column:
                name: sent_at
    rollback:
      - dropTable:
          tableName: qsp_auth_registration_sends
      - dropTable:
          tableName: qsp_auth_registrations
