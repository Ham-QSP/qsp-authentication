name: Authentication server CI

on:
  push:
    branches:
      - main
      - ciTest
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version, for example 1.0.0. Defaults to the current POM version without -SNAPSHOT.
        required: false
        type: string
      development_version:
        description: Next development version, for example 1.0.1-SNAPSHOT. Defaults to the Maven Release Plugin suggestion.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  JAVA_VERSION: '25'

jobs:
  # Formatting, build hygiene and compilation. Runs with -DskipTests so it needs
  # no Docker daemon, and fails on style before the slower Testcontainers build.
  quality:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      # maven-enforcer runs automatically in the validate phase.
      - name: Check formatting and compile
        run: ./mvnw --batch-mode -DskipTests spotless:check compile

  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      - name: Maven verify
        run: ./mvnw --batch-mode --update-snapshots verify

      - name: Upload build JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: target/*.jar

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            target/bom.json
            target/bom.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/site/jacoco
          if-no-files-found: ignore
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Build
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Download maven, build result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: target
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      # Build into the local daemon first so the image can be scanned before it
      # is published. The push below reuses this build from cache.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          tags: f4fez/qsp-authentication-server:latest
          context: .
          file: .package/Dockerfile

      - name: Scan image
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: f4fez/qsp-authentication-server:latest
          severity-cutoff: high
          # Only fail on vulnerabilities that have a fix available: an
          # unpatched base-image CVE must not block releases indefinitely.
          only-fixed: true
          fail-build: true
          output-format: sarif

      - name: Upload scan results
        # Publish findings even when the scan failed the build.
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-container

      - name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: f4fez/qsp-authentication-server:latest
          context: .
          file: .package/Dockerfile

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The release push authenticates through the global url.insteadOf
          # rewrite configured below, so checkout must not leave the token
          # behind in .git/config.
          persist-credentials: false

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure Maven SCM authentication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          # No Maven cache here on purpose: this job publishes release
          # artifacts, and a poisoned cache entry would end up inside them.
          # Releases are rare, so the lost cache hit costs little.

      - name: Resolve release options
        id: release-options
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          DEVELOPMENT_VERSION: ${{ inputs.development_version }}
        run: |
          if [[ -n "${RELEASE_VERSION}" ]]; then
            if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid release_version '${RELEASE_VERSION}', expected MAJOR.MINOR.PATCH"
              exit 1
            fi
            echo "release_args=-DreleaseVersion=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -n "${DEVELOPMENT_VERSION}" ]]; then
            if [[ ! "${DEVELOPMENT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
              echo "::error::Invalid development_version '${DEVELOPMENT_VERSION}', expected MAJOR.MINOR.PATCH-SNAPSHOT"
              exit 1
            fi
            echo "development_args=-DdevelopmentVersion=${DEVELOPMENT_VERSION}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Maven release
        shell: bash
        env:
          RELEASE_ARGS: ${{ steps.release-options.outputs.release_args }}
          DEVELOPMENT_ARGS: ${{ steps.release-options.outputs.development_args }}
        run: |
          extra_args=()
          if [[ -n "${RELEASE_ARGS}" ]]; then
            extra_args+=("${RELEASE_ARGS}")
          fi
          if [[ -n "${DEVELOPMENT_ARGS}" ]]; then
            extra_args+=("${DEVELOPMENT_ARGS}")
          fi

          ./mvnw --batch-mode \
            release:prepare release:perform \
            -Dgoals=package \
            -Darguments=-DskipTests \
            "${extra_args[@]}"

      - name: Resolve created release tag
        id: release
        shell: bash
        run: |
          tag="$(git describe --tags --abbrev=0)"
          version="${tag#v}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            target/checkout/target/*.jar \
            target/checkout/target/bom.json \
            target/checkout/target/bom.xml \
            --title "${RELEASE_TAG}" \
            --generate-notes

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          context: target/checkout
          file: target/checkout/.package/Dockerfile
          tags: |
            f4fez/qsp-authentication-server:${{ steps.release.outputs.version }}
            f4fez/qsp-authentication-server:latest
