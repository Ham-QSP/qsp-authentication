server.port: 9000
spring:
  application.name: authentication

  messages.fallback-to-system-locale: false

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: pgpass

logging:
  level:
    root: INFO
    fr.f4fez: INFO

qsp.authorization:
  clients:
    portal:
      redirect-uri:
        - "http://localhost:3000/login-redirect.html"
      post-logout-redirect-uris:
        - "http://localhost:3000"
      access-token-time-to-live: 3
      refresh-token-time-to-live: 720
      user-api-access: true

qsp.password-policy:
  min-length: 12
  max-length: 72
  min-uppercase: 1
  min-lowercase: 1
  min-digits: 1
  min-special: 1
  reject-username: true

# Self-registration. The mail server is configured with the standard Spring properties,
# e.g. SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD.
qsp.mail:
  from: noreply@localhost

qsp.registration:
  code-ttl: 15m
  max-attempts: 5
  max-sends-per-hour: 3
  resend-interval: 60s
  retention: 24h

# Signaling service called to create the station of a new user; issuer must match its issuer-uri.
qsp.signaling:
  base-url: http://localhost:7080
  issuer: http://localhost:9000
  subject: qsp-authentication
