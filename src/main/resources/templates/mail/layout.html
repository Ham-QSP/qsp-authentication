<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:fragment="layout(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Title</title>
</head>
<body style="margin:0;padding:12px;background:#f3f4f6;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
    <tr>
        <td style="padding:0 0 8px;font-weight:600;color:#52606d;" th:text="#{app.name}">QSP</td>
    </tr>
    <tr>
        <td style="padding:16px;background:#ffffff;border-radius:4px;">
            <h1 style="margin:0 0 12px;font-size:20px;" th:text="${title}">Title</h1>
            <th:block th:replace="${content}"></th:block>
        </td>
    </tr>
</table>
</body>
</html>
