<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout :: layout(#{mail.reset.subject}, ~{::content})}">
<body>
<div th:fragment="content">
    <p th:text="#{mail.reset.html.greeting(${callsign})}">Hello F4FEZ,</p>
    <p th:text="#{mail.reset.html.intro}">Your QSP verification code is:</p>
    <p style="margin:16px 0;font-size:32px;font-weight:700;letter-spacing:6px;font-family:ui-monospace,Menlo,Consolas,monospace;"
       th:text="${code}">123456</p>
    <p th:text="#{mail.reset.html.validity(${validMinutes})}">It is valid for 15 minutes.</p>
    <p style="color:#52606d;" th:text="#{mail.reset.html.ignore}">If you did not ask for an account, you can ignore this email.</p>
</div>
</body>
</html>
