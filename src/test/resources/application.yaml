spring:
  messages:
    fallback-to-system-locale: false
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:

qsp.authorization:
  clients:
    portal:
      redirect-uri:
        - "http://localhost:3000"
      post-logout-redirect-uris:
        - "http://localhost:3000/logout-done"
      access-token-time-to-live: 3
      refresh-token-time-to-live: 720
      user-api-access: true
    other:
      redirect-uri:
        - "http://localhost:4000"

qsp.password-policy:
  min-length: 1
  min-uppercase: 0
  min-lowercase: 0
  min-digits: 0
  min-special: 0
  reject-username: false

# No signaling service in the tests: registration tests that do not care fail fast and only log
qsp.signaling.base-url: http://localhost:1
