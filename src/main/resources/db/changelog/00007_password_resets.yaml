# Password reset requests waiting for the emailed code, with the send history behind the hourly limits.
databaseChangeLog:
- changeSet:
    id:  9
    author:  "Florian MAZEN"
    changes:
      - createTable:
          tableName: qsp_auth_password_resets
          columns:
            - column:
                name: id
                type: uuid
                defaultValueComputed: gen_random_uuid()
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: username
                type: varchar(100)
                constraints:
                  nullable: false
            - column:
                name: code_hash
                type: varchar(100)
                constraints:
                  nullable: false
            - column:
                name: code_expires_at
                type: timestamp
                constraints:
                  nullable: false
            - column:
                name: failed_attempts
                type: integer
                defaultValueNumeric: 0
                constraints:
                  nullable: false
            - column:
                name: last_sent_at
                type: timestamp
                constraints:
                  nullable: false
            - column:
                name: created_at
                type: timestamp
                constraints:
                  nullable: false
      - createIndex:
          indexName: ux_auth_password_resets_username_upper
          tableName: qsp_auth_password_resets
          unique: true
          columns:
            - column:
                name: upper(username)
                computed: true
      - createTable:
          tableName: qsp_auth_password_reset_sends
          columns:
            - column:
                name: id
                type: uuid
                defaultValueComputed: gen_random_uuid()
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: email
                type: varchar(320)
                constraints:
                  nullable: false
            - column:
                name: username
                type: varchar(100)
                constraints:
                  nullable: false
            - column:
                name: sent_at
                type: timestamp
                constraints:
                  nullable: false
      - createIndex:
          indexName: ix_auth_password_reset_sends_email
          tableName: qsp_auth_password_reset_sends
          columns:
            - column:
                name: email
            - column:
                name: sent_at
      - createIndex:
          indexName: ix_auth_password_reset_sends_username
          tableName: qsp_auth_password_reset_sends
          columns:
            - column:
                name: username
            - column:
                name: sent_at
    rollback:
      - dropTable:
          tableName: qsp_auth_password_reset_sends
      - dropTable:
          tableName: qsp_auth_password_resets
