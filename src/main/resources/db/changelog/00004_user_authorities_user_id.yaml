databaseChangeLog:
- changeSet:
    id:  6
    author:  "Florian MAZEN"
    changes:
      - addColumn:
          tableName: qsp_auth_user_authorities
          columns:
            - column:
                name: user_id
                type: uuid
      - sql:
          sql: >
            update qsp_auth_user_authorities ua set user_id = u.id
            from qsp_auth_users u where u.username = ua.username
      - addNotNullConstraint:
          tableName: qsp_auth_user_authorities
          columnName: user_id
          columnDataType: uuid
      - dropForeignKeyConstraint:
          baseTableName: qsp_auth_user_authorities
          constraintName: fk_authorities_users
      - dropIndex:
          tableName: qsp_auth_user_authorities
          indexName: ix_auth_user_authorities_username_authority
      - dropColumn:
          tableName: qsp_auth_user_authorities
          columnName: username
      - addForeignKeyConstraint:
          baseTableName: qsp_auth_user_authorities
          baseColumnNames: user_id
          constraintName: fk_user_authorities_user
          referencedTableName: qsp_auth_users
          referencedColumnNames: id
          onDelete: CASCADE
      - createIndex:
          columns:
            - column:
                name: user_id
            - column:
                name: authority
          indexName: ix_auth_user_authorities_user_id_authority
          tableName: qsp_auth_user_authorities
          unique: true
