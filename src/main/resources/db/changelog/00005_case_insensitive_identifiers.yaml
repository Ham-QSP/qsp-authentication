# Usernames are compared in uppercase and emails in lowercase: forbid rows that differ only by case.
databaseChangeLog:
- changeSet:
    id:  7
    author:  "Florian MAZEN"
    changes:
      - sql:
          sql: create unique index ux_auth_users_username_upper on qsp_auth_users (upper(username))
      - sql:
          sql: create unique index ux_auth_users_email_lower on qsp_auth_users (lower(email))
    rollback:
      - sql:
          sql: drop index ux_auth_users_email_lower
      - sql:
          sql: drop index ux_auth_users_username_upper
