databaseChangeLog:
- changeSet:
    id:  3
    author:  "Florian MAZEN"
    changes:
      - renameTable:
          oldTableName: qsp_auth_authorities
          newTableName: qsp_auth_user_authorities
      - dropIndex:
          tableName: qsp_auth_user_authorities
          indexName: ix_auth_authorities_username_authority
      - createIndex:
          columns:
            - column:
                name: username
            - column:
                name: authority
          indexName: ix_auth_user_authorities_username_authority
          tableName: qsp_auth_user_authorities
          unique: true

      - createTable:
          tableName:  qsp_auth_authorities
          columns:
            - column:
                name: authority
                type: varchar(100)
                constraints:
                  primaryKey: true
                  nullable: false

      - insert:
          tableName: qsp_auth_authorities
          columns:
            - column:
                name: authority
                value: 'ROLE_ADMIN'

      - addForeignKeyConstraint:
          baseTableName: qsp_auth_user_authorities
          baseColumnNames: authority
          constraintName: fk_user_authorities_authority
          referencedTableName: qsp_auth_authorities
          referencedColumnNames: authority
