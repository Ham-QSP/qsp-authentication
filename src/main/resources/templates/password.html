<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${expired} ? #{password.title.expired} : #{password.title.change}, ~{::content})}">
<body>
<div th:fragment="content">
    <p th:text="${expired} ? #{password.intro.expired(${username})} : #{password.intro.change(${username})}">Choose a new password.</p>
    <th:block th:if="${error}"><th:block th:replace="~{fragments/layout :: alert('error', ${error})}"></th:block></th:block>
    <form method="post" th:action="@{/password}" class="auth-form">
        <th:block th:unless="${expired}">
            <label for="currentPassword" th:text="#{password.current-password}">Current password</label>
            <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" autofocus required>
        </th:block>
        <label for="newPassword" th:text="#{password.new-password}">New password</label>
        <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" th:autofocus="${expired}" required>
        <label for="confirmPassword" th:text="#{password.confirm-password}">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
        <button type="submit" th:text="#{password.submit}">Change password</button>
    </form>
</div>
</body>
</html>
