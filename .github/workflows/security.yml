name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ "main" ]
  schedule:
    # Monday 06:00 UTC — catches findings that appear without a code change.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Correctness of the workflow files themselves: bad runner labels, invalid
  # expressions, and shellcheck over every `run:` block.
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Run the official image directly, pinned by digest. Wrapper actions need
      # checks: write or pull-requests: write to report, which a pull request
      # from a fork never gets; this needs no permissions at all and simply
      # fails the job on findings.
      - name: Run actionlint
        run: |
          docker run --rm \
            --volume "${PWD}:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # Known vulnerabilities in Maven dependencies, direct and transitive,
  # resolved against the OSV database. Results land in the Security tab.
  osv-scanner:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --recursive
        ./

  # Credentials committed to the repository, in the diff and across history.
  # Run from the official image, pinned by digest: the gitleaks action requires
  # a paid licence for organisation-owned repositories, the CLI does not.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        run: |
          docker run --rm \
            --volume "${PWD}:/repo" --workdir /repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --redact --verbose

  # Security auditing of the workflows: expression injection into `run:`,
  # unpinned actions, over-broad GITHUB_TOKEN permissions, risky triggers.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
